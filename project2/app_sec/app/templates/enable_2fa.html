<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enable 2FA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h3 class="mb-0">Enable Two-Factor Authentication (2FA)</h3>
                    </div>
                    <div class="card-body text-center">
                        <p>Scan the QR code below with your authenticator app (e.g., Google Authenticator).</p>
                        <!-- Exibir o QR code -->
                        <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR Code" class="img-fluid mb-3" />
                        <p class="text-muted">After scanning, enter the 6-digit code generated by your app in the form below.</p>
                        <a href="{{ url_for('auth.verify_totp') }}" class="btn btn-primary">Proceed to Verify</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
