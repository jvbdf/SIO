{% extends 'base.html' %}
{% block head %}
<style>
    .outlined-text {
        color: white;
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000; 
    }

    #carouselExampleCaptions {
        min-height: 100vh;
    }
    
    header {
        height: 80vh; 
        overflow: hidden;
        margin: 0 ; 
    }

    .carousel-item img {
        height: 100vh; 
        object-fit: cover; 
    }
    footer {
        background-color: #357A38;
        color: white;
        text-align: center;
        padding: 10px 0;
        height: 5px;
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .card-img-top {
        width: 100%;
        height: 200px; /* Altura fixa para todas as imagens */
        object-fit: cover; /* A imagem preenche a área definida, cortando se necessário */
    }
</style>
{% endblock %}

{% block title %}Deti Shop - Products{% endblock %}

{% block content %}

<section class="py-5" style="background-color: #F5F5DC;">
    <div class="container px-4 px-lg-5 mt-5">
        <!-- Category and Sort Filters -->
        <div class="mb-4 d-flex justify-content-between">
            <div>
                <label for="categoryFilter" class="form-label">Filter by Category:</label>
                <select id="categoryFilter" class="form-select">
                    <option value="all">All</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="sortFilter" class="form-label">Sort by:</label>
                <select id="sortFilter" class="form-select">
                    <option value="default">Default</option>
                    <option value="price_high">Highest Price</option>
                    <option value="price_low">Lowest Price</option>
                    <option value="name_asc">Name A-Z</option>
                    <option value="name_desc">Name Z-A</option>
                </select>
            </div>
        </div>

        <div id="product-container" class="row gx-4 gx-lg-5 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 justify-content-center">
            {% for product in products %}
                <div class="col mb-5 product-item" data-category="{{ product.category_id }}" data-price="{{ product.price }}" data-name="{{ product.name }}">
                    <div class="card h-100">
                        <!-- Product image-->
                        <img class="card-img-top" src="{{ url_for('static', filename=product.image_url.split('static/', 1)[-1]) }}" alt="{{ product.name }}" />
                        <!-- Product details-->
                        <div class="card-body p-4">
                            <div class="text-center">
                                <!-- Product name-->
                                <h5 class="fw-bolder">{{ product.name }}</h5>
                                <!-- Product price-->
                                <b>{{ product.price }} €</b>
                            </div>
                        </div>
                        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            <div class="d-flex justify-content-center gap-2">
                                <a class="btn btn-outline-dark" href="{{ url_for('products.view', id=product.id) }}">Shop Now</a>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>

        <!-- Pagination Controls -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center" id="pagination-controls"></ul>
        </nav>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const itemsPerPage = 8;
        const productItems = Array.from(document.querySelectorAll('.product-item'));
        const productContainer = document.getElementById('product-container');
        const paginationControls = document.getElementById('pagination-controls');
        const categoryFilter = document.getElementById('categoryFilter');
        const sortFilter = document.getElementById('sortFilter');
        let currentPage = 1;

        function filterAndSortProducts() {
            const selectedCategory = categoryFilter.value;
            const selectedSort = sortFilter.value;

            // Filter by category
            let filteredItems = productItems.filter(item => {
                const itemCategory = item.getAttribute('data-category');
                return selectedCategory === 'all' || itemCategory === selectedCategory;
            });

            // Sort products
            filteredItems.sort((a, b) => {
                switch (selectedSort) {
                    case 'price_high':
                        return parseFloat(b.getAttribute('data-price')) - parseFloat(a.getAttribute('data-price'));
                    case 'price_low':
                        return parseFloat(a.getAttribute('data-price')) - parseFloat(b.getAttribute('data-price'));
                    case 'name_asc':
                        return a.getAttribute('data-name').localeCompare(b.getAttribute('data-name'));
                    case 'name_desc':
                        return b.getAttribute('data-name').localeCompare(a.getAttribute('data-name'));
                    default:
                        return 0;
                }
            });

            return filteredItems;
        }

        function showPage(page, filteredItems) {
            currentPage = page;
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;

            // Hide all items first
            productItems.forEach(item => item.style.display = 'none');
            
            // Show only the items for the current page
            filteredItems.slice(start, end).forEach(item => item.style.display = 'block');

            // Clear the container and re-append sorted items
            productContainer.innerHTML = '';
            filteredItems.slice(start, end).forEach(item => productContainer.appendChild(item));

            updatePaginationControls(filteredItems.length);
        }

        function updatePaginationControls(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            paginationControls.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.classList.add('page-item');
                if (i === currentPage) {
                    li.classList.add('active');
                }
                const a = document.createElement('a');
                a.classList.add('page-link');
                a.textContent = i;
                a.href = '#';
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    showPage(i, filterAndSortProducts());
                });

                li.appendChild(a);
                paginationControls.appendChild(li);
            }
        }

        // Event listeners for filters
        categoryFilter.addEventListener('change', function() {
            const filteredItems = filterAndSortProducts();
            showPage(1, filteredItems);
        });

        sortFilter.addEventListener('change', function() {
            const filteredItems = filterAndSortProducts();
            showPage(1, filteredItems);
        });

        // Add to Cart functionality
        // document.querySelectorAll('.add-to-cart-btn').forEach(button => {
        //     button.addEventListener('click', function(event) {
        //         event.preventDefault();
        //         const productId = this.getAttribute('data-product-id');

        //         fetch('{{ url_for("cart.add_to_cart", product_id=0) }}'.replace('0', productId), {
        //             method: 'POST',
        //             headers: {
        //                 'Content-Type': 'application/json'
                        
        //             },
        //         })
        //         .then(response => response.json())
        //         .then(data => {
        //             if (data.success) {
        //                 console.log('Product added to cart!');
        //             } else {
        //                 console.log('There was an error adding the product to the cart.');
        //             }
        //         });
        //     });
        // });

        showPage(1, filterAndSortProducts());
    });
</script>

{% endblock %}
