{% extends 'base.html' %}

{% block title %}Search Results{% endblock %}

{% block content %}
<section class="py-5" style="background-color: #F5F5DC;">
    <div class="container px-4 px-lg-5 mt-5">
        <h2>Search Results for "{{ query }}"</h2>
        <div class="row gx-4 gx-lg-5 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 justify-content-center">
            {% if products %}
                {% for product in products %}
                    <div class="col mb-5">
                        <div class="card h-100">
                            <img class="card-img-top" src="{{ product.image_url }}" alt="{{ product.name }}" />
                            <div class="card-body p-4">
                                <div class="text-center">
                                    <h5 class="fw-bolder">{{ product.name }}</h5>
                                    <b>{{ product.price }} €</b>
                                </div>
                            </div>
                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                <div class="d-flex justify-content-center gap-2">
                                    <a class="btn btn-outline-dark" href="{{ url_for('products.view', id=product.id) }}">Shop Now</a>
                                </div>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <p>No products found.</p>
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}
